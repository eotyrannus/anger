app = 'anger-task-tracker'
primary_region = 'iad'

[build]

[env]
  PORT = '3000'
  DB_PATH = '/data/anger.db'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = 'anger_data'
  destination = '/data'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
